name: R006 integration-only export refresh (temporary)
on:
  push:
    branches:
      - mhac-integration/r006-nees-ft-20261110-1910
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mhac-integration/r006-nees-ft-20261110-1910
          fetch-depth: 0
          persist-credentials: true
      - name: Generate Integration-owned canonical exports
        run: python3 tools/validate.py --write-exports
      - name: Verify exact generated exports and source
        run: |
          python3 -m unittest discover -s tests
          python3 tools/validate.py
          python3 -m tools.build_record_fixtures --check
      - name: Commit generated views on this integration branch only
        env:
          BRANCH: mhac-integration/r006-nees-ft-20261110-1910
        run: |
          git add -- research/registry/generated/records-index.json research/registry/generated/evidence-flow.json research/registry/generated/evidence-flow.csv research/registry/generated/evidence-flow.md
          if git diff --cached --quiet; then
            echo "No export drift" && exit 0
          fi
          if git diff --name-only --cached | grep -v '^research/registry/generated/'; then
            echo "Unexpected staged path"; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R006 Integration: rebuild canonical Nees screening exports (Refs #6)'
          git push origin "HEAD:$BRANCH"
