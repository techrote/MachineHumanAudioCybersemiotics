name: R006 one-off serialized full-checkout integration
on:
  push:
    branches:
      - mhac-integration/r006-romeo23-ft-20261110-0957
permissions:
  contents: write
concurrency:
  group: r006-romeo23-integration-20261110
  cancel-in-progress: false
jobs:
  reconcile-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import reviewed three-file R006 proposal; regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          BASE=709b190c3c293283a70e9b6876c9de0e8f146cc5
          SOURCE=c15a049f8133f905808f7cd596c7ccbec9743f70
          test "$(git rev-parse HEAD^)" = "$BASE"
          git fetch --no-tags origin "refs/pull/116/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          EXPECTED="$(printf '%s\n' 'research/screening/r006_romeo23_ft_awaiting_20261110/README.md' 'research/screening/records/SCR-R006-REL-ROMEO-2023-FT.json' 'tests/test_r006_romeo23_ft_awaiting_20261110.py')"
          ACTUAL="$(git diff --name-only "$BASE" FETCH_HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --binary "$BASE" FETCH_HEAD -- research/screening/r006_romeo23_ft_awaiting_20261110/README.md research/screening/records/SCR-R006-REL-ROMEO-2023-FT.json tests/test_r006_romeo23_ft_awaiting_20261110.py | git apply --index
          python3 tools/validate.py --write-exports
          python3 -m unittest discover -s tests -v
          python3 tools/validate.py --previous-ref "$BASE"
          python3 -m tools.build_record_fixtures --check
          rm .github/workflows/integration-r006-romeo23-temp-20261110.yml
          git add -A
          git diff --cached --check
          printf 'Final staged file paths:\n'
          git diff --cached --name-only
          git diff --cached --name-only | while IFS= read -r p; do
            case "$p" in
              .github/workflows/integration-r006-romeo23-temp-20261110.yml|research/screening/r006_romeo23_ft_awaiting_20261110/README.md|research/screening/records/SCR-R006-REL-ROMEO-2023-FT.json|tests/test_r006_romeo23_ft_awaiting_20261110.py|research/registry/generated/records-index.json|research/registry/generated/evidence-flow.json) ;;
              *) echo "UNEXPECTED PATH: $p"; exit 2;;
            esac
          done
          test -n "$(git diff --cached --name-only | grep 'evidence-flow.json')"
          test -n "$(git diff --cached --name-only | grep 'records-index.json')"
          git config user.name "MHAC Integration Runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R006: integrate Romeo 2023 awaiting-text decision and synchronized exports (Refs #6)"
          git push origin HEAD:refs/heads/mhac-integration/r006-romeo23-ft-20261110-0957
