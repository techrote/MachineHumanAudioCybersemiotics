# Temporary targeted #607 qualification; remove or retain only after owner review.
name: Adversarial 607 native package
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/experimental/mergedown-607/adversarial-001/**'
      - '.github/workflows/mergedown-607-adversarial.yml'
permissions:
  contents: read
concurrency:
  group: adversarial-607-native
  cancel-in-progress: false
jobs:
  native-package:
    if: github.event.pull_request.number == 700 && github.event.pull_request.head.ref == 'mhac-607/mergedown-adversarial-001' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve frozen source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # The frozen overlap receipt includes sys.version.split()[0].
      - name: Select exact reference Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Native reconstruction and independent audit
        id: rebuild
        working-directory: tools/experimental/mergedown-607/adversarial-001
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git rev-parse HEAD
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 13, 5), sys.version"
          node --version
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -B build_adversarial.py (Join-Path $env:RUNNER_TEMP 'adversarial 607') --source-root source-inputs
      # Failure evidence is diagnostic only; this never converts a failed strict build into a pass.
      - name: Capture failed reconstruction evidence
        if: failure() && steps.rebuild.outcome == 'failure'
        working-directory: tools/experimental/mergedown-607/adversarial-001
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $diag = Join-Path $env:RUNNER_TEMP 'adversarial-diagnostic'
          New-Item -ItemType Directory -Path $diag | Out-Null
          python -c "import sys,numpy; print(sys.version); print(numpy.__version__)" | Set-Content -Encoding utf8 (Join-Path $diag 'runtime.txt')
          python -B source-inputs/binding/source-binding-boundary.py source-inputs/binding (Join-Path $diag 'binding')
          python -B source-inputs/overlap/overlap-admission-audit.py source-inputs/overlap (Join-Path $diag 'overlap')
      - name: Retain failure diagnostics (not an owner package)
        if: failure() && steps.rebuild.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MHAC-Adversarial-607-DIAGNOSTIC-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/adversarial-diagnostic/
          if-no-files-found: warn
          retention-days: 14
      - name: Native filesystem and ordinary browser checks
        working-directory: tools/experimental/mergedown-607/adversarial-001
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (!(Test-Path -LiteralPath $chrome -PathType Leaf)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'
          }
          if (!(Test-Path -LiteralPath $chrome -PathType Leaf)) { throw 'Installed Chrome executable not found' }
          node check_adversarial_package.cjs (Join-Path $env:RUNNER_TEMP 'adversarial 607') $chrome | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'adversarial-qualification.json')
      - name: Retain owner package and qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MHAC-Adversarial-607-Windows-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/adversarial 607/
            ${{ runner.temp }}/adversarial-qualification.json
          if-no-files-found: error
          retention-days: 14
