name: MHAC acceleration Windows host audition
on:
  pull_request:
    paths:
      - 'tools/experimental/vst-acceleration/native-chain/host_audition.py'
      - 'tools/experimental/vst-acceleration/native-chain/loom_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/winters_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/winters_sdk_probe.cpp'
      - 'tools/experimental/vst-acceleration/native-chain/afterimage_receipt_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/receipt_fold_upgrade_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/afterimage_depth_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/upgraded_chain_host.py'
      - 'tools/experimental/vst-acceleration/native-chain/phase_balanced_host.py'
      - '.github/workflows/mhac-accel-host-audition.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mhac-accel-host-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audition:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'mhac-vst-632/native-chain'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install bounded host dependencies
        shell: pwsh
        run: |
          py -3.12 -m pip install --only-binary=:all: pedalboard==0.9.23 numpy==2.3.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact original Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o golden.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14987637390/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o freeze.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14986731404/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real host load, render and fresh instance restore
        shell: pwsh
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/host_audition.py --gold golden.zip --freeze freeze.zip --out audition
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact standard and XL effect packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o loom.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15079064731/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o loomxl.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15079254571/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Independent standard and XL latency and preset matrix
        shell: pwsh
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/loom_host.py --standard loom.zip --xl loomxl.zip --out loom-audition
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact Three Winters package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o winters.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15068070040/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Three Winters continuous MIDI and independent timbre witness
        id: winters
        shell: pwsh
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/winters_host.py --archive winters.zip --out winters-audition
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Direct SDK bus and MIDI diagnostic (preserve original failure)
        if: failure() && steps.winters.outcome == 'failure'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'sdk380-accel'
          git clone --branch v3.8.0_build_66 --depth 1 https://github.com/steinbergmedia/vst3sdk.git $sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((git -C $sdk rev-parse HEAD) -ne '9fad9770f2ae8542ab1a548a68c1ad1ac690abe0') { throw 'SDK root mismatch' }
          git -C $sdk submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pins = @{
            base='3d2e82f8e6bff59c1d8b7a27491a29c2286b5206'
            cmake='de6e54eeaaab35b7145f5c32c279b5e892146e04'
            doc='6d4737c9e70750056e731d88d49aa06eefc8a1a4'
            pluginterfaces='31d6eeba6daaa3e2a8bfbe3e7a90ca0b7fbfbc1c'
            'public.sdk'='a3911a4615dabbfdfd9d181ee26b05c70c289a95'
            tutorials='33b73dfbb87f3fde3bce8c0a10cae934dc66ad34'
            vstgui4='76823bdbe286e4bdb9f79ab8986af5ce7202336c'
          }
          foreach ($k in $pins.Keys) {
            $actual = git -C (Join-Path $sdk $k) rev-parse HEAD
            if ($LASTEXITCODE -or $actual -ne $pins[$k]) { throw "SDK gitlink mismatch: $k" }
          }
          git -C $sdk submodule status --recursive | Out-File winters-audition/sdk-probe-gitlinks.txt
          New-Item -ItemType Directory -Force sdk-probe-src | Out-Null
          @'
          cmake_minimum_required(VERSION 3.25)
          project(MHACWintersSDKProbe LANGUAGES C CXX)
          if(NOT WIN32)
            message(FATAL_ERROR "This target currently qualifies Windows x64 only")
          endif()
          set(SMTG_ENABLE_VSTGUI_SUPPORT OFF CACHE BOOL "" FORCE)
          set(SMTG_ENABLE_VST3_PLUGIN_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SMTG_ENABLE_VST3_HOSTING_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SMTG_RUN_VST_VALIDATOR OFF CACHE BOOL "" FORCE)
          # CMake reparses source path arguments; native Windows backslashes can be escapes.
          string(REPLACE "\\" "/" SDK380 "${SDK380}")
          string(REPLACE "\\" "/" PROBE_SOURCE "${PROBE_SOURCE}")
          add_subdirectory("${SDK380}" sdk EXCLUDE_FROM_ALL)
          add_executable(winters_sdk_probe "${PROBE_SOURCE}" "${SDK380}/public.sdk/source/vst/hosting/module_win32.cpp")
          target_compile_features(winters_sdk_probe PRIVATE cxx_std_17)
          target_compile_definitions(winters_sdk_probe PRIVATE NOMINMAX)
          target_link_libraries(winters_sdk_probe PRIVATE sdk_hosting)
          '@ | Set-Content sdk-probe-src/CMakeLists.txt -Encoding utf8
          $src = (Resolve-Path tools/experimental/vst-acceleration/native-chain/winters_sdk_probe.cpp).Path
          cmake -S sdk-probe-src -B sdk-probe-build -A x64 "-DSDK380=$sdk" "-DPROBE_SOURCE=$src" 2>&1 | Tee-Object winters-audition/sdk-probe-configure.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build sdk-probe-build --config Release --target winters_sdk_probe --parallel 2 2>&1 | Tee-Object winters-audition/sdk-probe-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = (Resolve-Path winters-audition/plugin/MHACThreeWinters.vst3).Path
          & sdk-probe-build/Release/winters_sdk_probe.exe $bundle 2>&1 | Tee-Object winters-audition/sdk-probe.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact Afterimage Choir and Receipt Fold packages
        if: ${{ !cancelled() }}
        id: afterimage_packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o afterimage.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15123228931/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o receipt-fold.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15128221747/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Independent Afterimage and Receipt Fold host chain
        if: ${{ !cancelled() && steps.afterimage_packages.outcome == 'success' }}
        shell: pwsh
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/afterimage_receipt_host.py --instrument afterimage.zip --effect receipt-fold.zip --out afterimage-audition
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact Receipt Fold 0.2.0 upgrade package
        if: ${{ !cancelled() && steps.afterimage_packages.outcome == 'success' }}
        id: receipt_upgrade_package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o receipt-fold-upgrade.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15132659258/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Receipt Fold legacy migration and extended transfer
        if: ${{ !cancelled() && steps.receipt_upgrade_package.outcome == 'success' }}
        shell: pwsh
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/receipt_fold_upgrade_host.py --old receipt-fold.zip --new receipt-fold-upgrade.zip --out receipt-upgrade
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact Afterimage Choir 0.2.0 upgrade package
        if: ${{ !cancelled() && steps.afterimage_packages.outcome == 'success' }}
        id: afterimage_depth_package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o afterimage-depth.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15135667500/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Afterimage Choir legacy and memory depth spectral matrix
        if: ${{ !cancelled() && steps.afterimage_depth_package.outcome == 'success' }}
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/afterimage_depth_host.py --old afterimage.zip --new afterimage-depth.zip --out afterimage-depth
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact upgraded Afterimage and Receipt Fold musical chain
        if: ${{ !cancelled() && steps.afterimage_depth_package.outcome == 'success' && steps.receipt_upgrade_package.outcome == 'success' }}
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/upgraded_chain_host.py --instrument afterimage-depth.zip --effect receipt-fold-upgrade.zip --out upgraded-chain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Recover exact 0.3.0 Phase Memory and Balanced Receipt packages
        if: ${{ !cancelled() && steps.afterimage_depth_package.outcome == 'success' && steps.receipt_upgrade_package.outcome == 'success' }}
        id: phase_balanced_packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o afterimage-phase.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15143966343/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" -o receipt-balanced.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15145497011/zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact 0.3.0 phase and balanced host migration and contrasts
        if: ${{ !cancelled() && steps.phase_balanced_packages.outcome == 'success' }}
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          py -3.12 tools/experimental/vst-acceleration/native-chain/phase_balanced_host.py --a2 afterimage-depth.zip --f2 receipt-fold-upgrade.zip --a3 afterimage-phase.zip --f3 receipt-balanced.zip --out phase-balanced
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mhac-host-audition-evidence
          path: |
            audition/host-receipt.json
            audition/dry.wav
            audition/wet.wav
            loom-audition/loom-receipt.json
            loom-audition/*.wav
            winters-audition/winters-receipt.json
            winters-audition/*.wav
            winters-audition/*.vstpreset
            winters-audition/sdk-probe*.txt
            afterimage-audition/afterimage-receipt-host.json
            receipt-upgrade/receipt-upgrade.json
            afterimage-depth/afterimage-depth.json
            upgraded-chain/upgraded-chain.json
            phase-balanced/phase-balanced.json
          if-no-files-found: ignore
          retention-days: 7
