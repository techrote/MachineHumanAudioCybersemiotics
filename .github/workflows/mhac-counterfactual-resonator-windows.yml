name: Counterfactual Resonator Windows qualification
on:
  pull_request:
    paths:
      - 'tools/experimental/signal-foundry/counterfactual-resonator-748/**'
      - '.github/workflows/mhac-counterfactual-resonator-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counterfactual-resonator-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native core and regression
        run: |
          python tools/experimental/signal-foundry/counterfactual-resonator-748/verify_moduleinfo.py --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tools/experimental/signal-foundry/counterfactual-resonator-748 -B build-core -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-core --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-core -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build-core/Release/counterfactual_host_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact SDK checkout
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'sdk380-counterfactual'
          git clone --branch v3.8.0_build_66 --depth 1 https://github.com/steinbergmedia/vst3sdk.git $sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = git -C $sdk rev-parse HEAD
          if ($LASTEXITCODE -or $root -ne '9fad9770f2ae8542ab1a548a68c1ad1ac690abe0') { throw 'Wrong SDK root' }
          git -C $sdk submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $sdk submodule status --recursive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SDK380=$sdk" >> $env:GITHUB_ENV
      - name: Build exact SDK plugin and validator
        run: |
          cmake -S tools/experimental/signal-foundry/counterfactual-resonator-748 -B build-vst -A x64 -DMHAC_BUILD_VST3=ON -DMHAC_VALIDATE_POST_BUILD=OFF "-DMHAC_VST3_SDK=$env:SDK380"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-vst --config Release --target MHACCounterfactualResonator MHACHarmonicMemoryBank validator bank_sdk_replay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Official validator (mandatory)
        run: |
          $bundles = @(Get-ChildItem build-vst -Recurse -Directory -Filter 'MHACCounterfactualResonator.vst3' | Where-Object { Test-Path (Join-Path $_.FullName 'Contents/x86_64-win/MHACCounterfactualResonator.vst3') })
          if ($bundles.Count -ne 1) { throw "Expected one x64 plugin bundle; found $($bundles.Count)" }
          $validator = Get-ChildItem build-vst -Recurse -File -Filter validator.exe | Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $validator) { throw 'Official Release validator not found' }
          & $validator.FullName $bundles[0].FullName 2>&1 | Tee-Object -FilePath validator.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          if (-not (Select-String -Path validator.txt -Pattern 'Result:\s+[1-9][0-9]* tests passed, 0 tests failed')) { throw 'Missing successful validator summary' }
          if (Select-String -Path validator.txt -Pattern 'ERROR:') { throw 'Explicit validator error despite aggregate result' }
          "BUNDLE=$($bundles[0].FullName)" >> $env:GITHUB_ENV
      - name: Package portable bundle and evidence
        run: |
          New-Item -ItemType Directory -Path delivery | Out-Null
          Copy-Item -Recurse $env:BUNDLE delivery/
          Copy-Item "$env:SDK380/LICENSE.txt" delivery/Steinberg-SDK-LICENSE.txt
          git -C $env:SDK380 submodule status --recursive | Out-File delivery/SDK-GITLINKS.txt -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "sdk=$(git -C $env:SDK380 rev-parse HEAD)" | Out-File delivery/BUILD-SOURCE.txt -Encoding utf8
          "source=$(git rev-parse HEAD)" | Out-File delivery/BUILD-SOURCE.txt -Append -Encoding utf8
          Copy-Item validator.txt delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/README.md delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/HOST-BRIDGE.md delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/VST3.md delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/SDK-PIN.txt delivery/
          New-Item -ItemType Directory -Path delivery/Presets,delivery/Audio | Out-Null
          & build-core/Release/counterfactual_lab.exe --render delivery
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build-core/Release/counterfactual_probe.exe --render delivery
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($part in @('base','pluginterfaces','public.sdk','cmake')) {
            $root = Join-Path $env:SDK380 $part
            Get-ChildItem $root -File | Where-Object { $_.Name -match '^(LICENSE|NOTICE|COPYING)([.-]|$)' } | ForEach-Object { Copy-Item $_.FullName ("delivery/SDK-" + $part + "-" + $_.Name) }
          }
          python -c "from pathlib import Path; import zipfile; r=Path('delivery'); z=zipfile.ZipFile('MHACCounterfactualResonator-Windows-x64.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(r)) for p in sorted(r.rglob('*')) if p.is_file()]; z.close()"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/experimental/signal-foundry/counterfactual-resonator-748/verify_moduleinfo.py MHACCounterfactualResonator MHACCounterfactualResonator-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash MHACCounterfactualResonator-Windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MHACCounterfactualResonator-validator-log
          path: validator.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: MHACCounterfactualResonator-Windows-x64
          path: MHACCounterfactualResonator-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Harmonic Memory Bank official validator and portable delivery
        run: |
          $bundles = @(Get-ChildItem build-vst -Recurse -Directory -Filter 'MHACHarmonicMemoryBank.vst3' | Where-Object { Test-Path (Join-Path $_.FullName 'Contents/x86_64-win/MHACHarmonicMemoryBank.vst3') })
          if ($bundles.Count -ne 1) { throw "Expected one x64 bank bundle; found $($bundles.Count)" }
          $validator = Get-ChildItem build-vst -Recurse -File -Filter validator.exe | Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $validator) { throw 'Official Release validator not found' }
          & $validator.FullName $bundles[0].FullName 2>&1 | Tee-Object -FilePath bank-validator.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          if (-not (Select-String -Path bank-validator.txt -Pattern 'Result:\s+[1-9][0-9]* tests passed, 0 tests failed')) { throw 'Missing successful bank validator summary' }
          if (Select-String -Path bank-validator.txt -Pattern 'ERROR:') { throw 'Explicit bank validator error' }
          & build-vst/Release/bank_sdk_replay.exe $bundles[0].FullName 2>&1 | Tee-Object -FilePath bank-sdk-replay.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_CASE rate=').Count -ne 128) { throw 'Incomplete bank replay case transcript' }
          if (-not (Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_REPLAY_PASS cases=128 checks=[1-9][0-9]*$')) { throw 'Missing bank replay completion' }
          if (-not (Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_CONTROLLER_PASS parameters=45$')) { throw 'Missing bank controller receipt' }
          if (@(Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_BUDGET_CASE rate=').Count -ne 16) { throw 'Incomplete budget replay transcript' }
          if (-not (Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_BUDGET_PASS cases=16$')) { throw 'Missing budget replay completion' }
          if (@(Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_KEY_CASE rate=').Count -ne 32) { throw 'Incomplete sidechain replay transcript' }
          if (-not (Select-String -Path bank-sdk-replay.txt -Pattern '^SDK_BANK_KEY_PASS cases=32
          Copy-Item bank-sdk-replay.txt bank-delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/BANK-BUDGET.md bank-delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/BANK-SDK-REPLAY.md bank-delivery/
          Copy-Item -Recurse $bundles[0].FullName bank-delivery/
          Copy-Item delivery/SDK-*.txt,delivery/Steinberg-SDK-LICENSE.txt,delivery/BUILD-SOURCE.txt bank-delivery/
          Copy-Item bank-validator.txt bank-delivery/
          Copy-Item tools/experimental/signal-foundry/counterfactual-resonator-748/BANK-VST3.md,tools/experimental/signal-foundry/counterfactual-resonator-748/BANK-HOST.md bank-delivery/
          python tools/experimental/signal-foundry/counterfactual-resonator-748/bank_presets.py bank-delivery/Presets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build-core/Release/counterfactual_bank_render.exe bank-delivery/Audio
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path bank-delivery/BudgetPerformance,bank-delivery/BudgetPerformance/Presets,bank-delivery/BudgetPerformance/Audio | Out-Null
