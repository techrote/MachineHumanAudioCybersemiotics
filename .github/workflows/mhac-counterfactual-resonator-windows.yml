          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/experimental/signal-foundry/counterfactual-resonator-748/verify_moduleinfo.py MHACHarmonicMemoryBank MHACHarmonicMemoryBank-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash MHACHarmonicMemoryBank-Windows-x64.zip -Algorithm SHA256
