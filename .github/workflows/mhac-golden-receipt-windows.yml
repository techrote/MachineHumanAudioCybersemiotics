name: Golden Receipt Windows qualification
on:
  pull_request:
    paths:
      - 'tools/experimental/instrument-foundry/golden-receipt/**'
      - '.github/workflows/mhac-golden-receipt-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-receipt-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native core
        run: |
          cmake -S tools/experimental/instrument-foundry/golden-receipt -B build-core -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-core --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-core -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exact SDK checkout
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'sdk380'
          git clone --branch v3.8.0_build_66 --depth 1 https://github.com/steinbergmedia/vst3sdk.git $sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = git -C $sdk rev-parse HEAD
          if ($LASTEXITCODE -or $root -ne '9fad9770f2ae8542ab1a548a68c1ad1ac690abe0') { throw 'Wrong SDK root' }
          git -C $sdk submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $sdk submodule status --recursive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SDK380=$sdk" >> $env:GITHUB_ENV
      - name: Build plugin and official validator
        run: |
          cmake -S tools/experimental/instrument-foundry/golden-receipt -B build-vst -A x64 -DMHAC_BUILD_VST3=ON "-DMHAC_VST3_SDK=$env:SDK380"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-vst --config Release --target MHACGoldenReceipt validator
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundles = @(Get-ChildItem build-vst -Recurse -Directory -Filter 'MHACGoldenReceipt.vst3' | Where-Object { Test-Path (Join-Path $_.FullName 'Contents/x86_64-win/MHACGoldenReceipt.vst3') })
          if ($bundles.Count -ne 1) { throw "Expected one x64 plugin bundle; found $($bundles.Count)" }
          $validator = Get-ChildItem build-vst -Recurse -File -Filter validator.exe | Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $validator) { throw 'Official Release validator not found' }
          & $validator.FullName $bundles[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path delivery | Out-Null
          Copy-Item -Recurse $bundles[0].FullName delivery/
          Copy-Item "$env:SDK380/LICENSE.txt" delivery/Steinberg-SDK-LICENSE.txt
          git -C $env:SDK380 submodule status --recursive | Out-File delivery/SDK-GITLINKS.txt -Encoding utf8
          "source=$env:GITHUB_SHA" | Out-File delivery/BUILD-SOURCE.txt -Encoding utf8
          git rev-parse HEAD | Out-File delivery/BUILD-SOURCE.txt -Append -Encoding utf8
          Copy-Item tools/experimental/instrument-foundry/golden-receipt/README.md delivery/
          Compress-Archive -Path delivery/* -DestinationPath MHACGoldenReceipt-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MHACGoldenReceipt-Windows-x64
          path: MHACGoldenReceipt-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
