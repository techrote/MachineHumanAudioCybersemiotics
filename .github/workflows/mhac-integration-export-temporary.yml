name: Integration one-time R005 R006 export build
on:
  push:
    branches:
      - mhac-integration/r005-r006-source-screen-20261110
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.head_commit.message == 'integration: stage R005/R006 primary provenance and screening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rebuild canonical exports from source
        run: |
          python3 tools/validate.py --write-exports
          python3 tools/validate.py
          python3 -m tools.build_record_fixtures --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/registry/generated/records-index.json research/registry/generated/evidence-flow.json research/registry/generated/evidence-flow.md research/registry/generated/evidence-flow.csv
          if ! git diff --cached --quiet; then
            git commit -m 'integration: regenerate source-exact R006 exports'
            git push origin HEAD:mhac-integration/r005-r006-source-screen-20261110
          fi
