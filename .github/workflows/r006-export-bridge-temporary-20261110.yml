name: Temporary R006 integration export bridge
on:
  push:
    branches:
      - mhac-integration/r006-ta-sabic-arrabito-20261110
    paths:
      - .github/workflows/r006-export-bridge-temporary-20261110.yml
permissions:
  contents: write
jobs:
  rebuild-r006-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Assert source head / provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "13d79e6fbef592766aa6a36dd5fee135222a147b"
          test -f research/screening/records/SCR-R006-SABIC-2021-NOISE-TA.json
          test -f research/screening/records/SCR-R006-ARRABITO-2004-URGENCY-TA.json
      - name: Generate deterministic canonical views
        run: |
          set -euo pipefail
          python3 tools/validate.py --write-exports
          python3 research/screening/r006_next_ta2_20261110/verify.py
          python3 -m unittest discover -s tests -v
          python3 tools/validate.py --previous-ref 7e2975466f5c3fb43eb7d099a879090bc5d24818
          python3 -m tools.build_record_fixtures --check
      - name: Commit ONLY generated views to Integration branch
        run: |
          set -euo pipefail
          git add -- research/registry/generated/evidence-flow.json research/registry/generated/records-index.json
          git diff --cached --quiet && { echo "ERROR: no export change"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "R006 integration: regenerate canonical evidence flow and records index"
          git push origin HEAD:refs/heads/mhac-integration/r006-ta-sabic-arrabito-20261110
