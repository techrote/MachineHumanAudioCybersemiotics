name: Temporary R006 FT integrator export regeneration

on:
  push:
    branches:
      - mhac-integration/r006-kuhne-ft-canonical-20261110-0904

permissions:
  contents: write

jobs:
  serial-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate exports and qualify canonical full-text admission
        run: |
          python3 tools/validate.py --write-exports
          python3 -m unittest discover -s tests -v
          python3 tools/validate.py --previous-ref c5e0de41071b07a68b0e7ddc57b344a56d2dcd18
          python3 -m tools.build_record_fixtures --check
      - name: Commit synchronized exports and retire temporary regeneration workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/registry/generated/
          git rm .github/workflows/r006-ft-refresh-20261110.yml
          git diff --cached --check
          git commit -m 'R006: serialize Kühne canonical full-text exports (Refs #6)'
          git push origin HEAD:mhac-integration/r006-kuhne-ft-canonical-20261110-0904
