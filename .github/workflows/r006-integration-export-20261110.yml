name: R006 one-shot export rebuild (temporary integration only)
on:
  push:
    branches:
      - mhac-integration/r006-sabic-export-20261110-1756
permissions:
  contents: write
jobs:
  regenerate:
    name: regenerate-canonical-exports
    if: github.repository == 'techrote/MachineHumanAudioCybersemiotics'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate after full record preflight
        run: |
          python3 tools/validate.py --write-exports
          python3 -m unittest discover -s tests -q
          python3 tools/validate.py --previous-ref a7301d37b8077d2105072d543c567b37f6949bdc
          python3 -m tools.build_record_fixtures --check
      - name: Commit only generated views to this integration branch
        run: |
          git add -- research/registry/generated/records-index.json research/registry/generated/evidence-flow.json research/registry/generated/evidence-flow.csv research/registry/generated/evidence-flow.md
          if git diff --cached --quiet; then
            echo "Exports already exact; nothing to write"
            exit 0
          fi
          git -c user.name="MHAC Integration Automation" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "R006: regenerate deterministic screening exports (Refs #6)"
          git push origin HEAD:refs/heads/mhac-integration/r006-sabic-export-20261110-1756
