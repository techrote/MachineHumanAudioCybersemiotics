name: Integration R006 one-time deterministic export regeneration
on:
  push:
    branches:
      - mhac-integration/r006-nextpair-export-20261110-2008
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[exports-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Revalidate and regenerate only canonical exports
        run: |
          python3 tools/validate.py --write-exports > /tmp/r006-generated-report.json
          python3 -m tools.build_record_fixtures --check
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' research/registry/generated/evidence-flow.json research/registry/generated/records-index.json | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected generated file scope: $actual" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/registry/generated/evidence-flow.json research/registry/generated/records-index.json
          git commit -m "R006 Integration: regenerate canonical evidence-flow and record index [exports-generated]"
          git push origin HEAD:"$GITHUB_REF_NAME"
