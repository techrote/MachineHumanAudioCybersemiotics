name: One-time R006 Stevens canonical export regeneration
on:
  push:
    branches:
      - mhac-integration/r006-stevens-export-20261110-2105
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[exports-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Build only the canonical exports and verify deterministic fixtures
        run: |
          python3 tools/validate.py --write-exports > /tmp/r006-stevens-export-report.json
          python3 -m tools.build_record_fixtures --check
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' research/registry/generated/evidence-flow.json research/registry/generated/records-index.json | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected generated file scope: $actual" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/registry/generated/evidence-flow.json research/registry/generated/records-index.json
          git commit -m "R006 Integration: regenerate canonical Stevens screening exports [exports-generated]"
          git push origin HEAD:"$GITHUB_REF_NAME"
