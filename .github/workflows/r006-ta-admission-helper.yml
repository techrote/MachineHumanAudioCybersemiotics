name: R006 canonical TA admission helper (ephemeral)
on:
  push:
    branches:
      - mhac-integration/r006-ta-admission-runner-20261110-0813
permissions:
  contents: write
concurrency:
  group: mhac-r006-ta-admission-20261110
  cancel-in-progress: false
jobs:
  register-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Register four title/abstract source-pinned records on full checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8f34dadfcb15e65db224fcc8f81ae5ab34f28ea7"
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          repo = Path.cwd()
          at = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          actor = "gpt6-r006-integration-registrar-20261110"
          sources = ("BECKER-2025", "ROMEO-2025", "KUHNE-2020", "ROMEO-2023")
          target = repo / "research/screening/records"
          if target.exists():
              raise SystemExit("Refuse to overwrite or duplicate an existing SCR root")
          target.mkdir(parents=True)
          original = json.loads((repo / "research/screening/r006_r004_crosslane_20261110/DECISIONS.json").read_text())
          if original["actor"]["id"] != "gpt6-r006-crosslane-20261110":
              raise SystemExit("Original first-pass screening identity drift")
          counts = {"include": 0, "uncertain": 0}
          for suffix in sources:
              rid = "SCR-R006-REL-" + suffix + "-TA"
              output = subprocess.check_output([
                  "python3", "research/screening/r006_scr_admission_bridge_20261110/build_candidates.py",
                  "--at", at, "--actor-id", actor, "--record", rid
              ], text=True)
              record = json.loads(output)
              assert record["id"] == rid and record["issue"] == 6
              assert record["revisions"][0]["actor"]["kind"] == "agent"
              assert record["revisions"][0]["at"] == at
              counts[record["revisions"][0]["data"]["decision"]] += 1
              (target / (rid + ".json")).write_text(
                  json.dumps(record, indent=2, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8")
          if counts != {"include": 2, "uncertain": 2}:
              raise SystemExit("Unexpected TA decision counts")
          path = repo / "research/registry/state.json"
          manifest = json.loads(path.read_text())
          root = "research/screening/records"
          if root in manifest["record_roots"] or manifest["research_state"] != "in_progress":
              raise SystemExit("Unexpected manifest state")
          manifest["record_roots"] = sorted([*manifest["record_roots"], root])
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          receipt = repo / "research/screening/r006_ta_admission_receipt_20261110/README.md"
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text(f"""# R006 canonical first-stage screening registration receipt

          Refs #6. Integration registration executed on {at}, from base main 8f34dadfcb15e65db224fcc8f81ae5ab34f28ea7.

          Four canonical title/abstract SCRs use actual current registration timestamp and agent registrar {actor}. The underlying first-pass decisions were made on 2026-11-10 by gpt6-r006-crosslane-20261110, with no more precise authentic time recorded, in research/screening/r006_r004_crosslane_20261110/DECISIONS.json. This registrar transcribed those historical decisions, not independently re-screened them and not retrospectively assigned itself as the original screener.

          Becker 2025 and Romeo 2025: include *only to seek full text*. Kühne 2020 and Romeo 2023: uncertain *also retained for full text*. Exclude 0; no canonical full-text decision, STUDY, EXP or SAMPLE, independent human assessor, selected Track E/G corpus or completed R006.

          Verified source identity pins and DOIs: 10.1145/3706066; 10.1145/3711938; 10.3389/fnbot.2020.593732; 10.1109/ro-man57019.2023.10309631. Source access was abstract-only *for the first screening pass*; the bridge truthfully supplies empty reading/review refs rather than inventing canonical source-reading assistance. Separate later evidence on Becker does not retrospectively alter the earlier title/abstract decision.

          Frozen literature cutoff: 2026-10-04. Follow frozen v1 §6.2 and continue full-text access, exclusions recheck, publication-study-sample identity, remaining R005 coverage and selected corpus. Generated exports require exact-final-head and merged-main CI before qualifying the integration. R005, R006, R007 and R008 remain scientifically open.
          """.replace("\n          ", "\n"), encoding="utf-8")
          print("R006 SCR registration counts", counts, "at", at, "registrar", actor)
          PY
      - name: Rebuild deterministic exports, full validation and history
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate.py --write-exports
          python3 -m unittest discover -s tests -v
          python3 tools/validate.py --previous-ref 8f34dadfcb15e65db224fcc8f81ae5ab34f28ea7
          python3 -m tools.build_record_fixtures --check
          git diff --check
      - name: Commit only validated records and exports and remove ephemeral helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r006-ta-admission-helper.yml
          git add -A research/screening/records research/screening/r006_ta_admission_receipt_20261110 research/registry/state.json research/registry/generated .github/workflows/r006-ta-admission-helper.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R006: register four source-pinned title/abstract screenings (Refs #6)"
          git push origin HEAD:mhac-integration/r006-ta-admission-runner-20261110-0813
