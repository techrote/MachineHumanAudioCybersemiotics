name: R006 temporary deterministic export reconciliation
on:
  push:
    branches:
      - mhac-integration/r006-next-ta-serialization-20261110-1456
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate original deterministic repository exports
        run: python3 tools/validate.py --write-exports
      - name: Commit generated artifacts on integration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/registry/generated
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'R006: regenerate canonical indexes and evidence flow for two source-backed title/abstract records'
            git push origin HEAD:refs/heads/mhac-integration/r006-next-ta-serialization-20261110-1456
          fi
