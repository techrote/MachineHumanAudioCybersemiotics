name: Research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Runtime
        run: python3 --version
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository
        env:
          RESEARCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$RESEARCH_BASE" ] || [ "$RESEARCH_BASE" = "0000000000000000000000000000000000000000" ]; then
            RESEARCH_BASE="$(git rev-parse HEAD^)"
          fi
          python3 tools/validate.py --previous-ref "$RESEARCH_BASE" --report build/validation.json
      - name: Check deterministic synthetic fixtures
        run: python3 -m tools.build_record_fixtures --check
