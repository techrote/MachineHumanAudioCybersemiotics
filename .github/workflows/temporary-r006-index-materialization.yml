name: One-shot R006 integration export materialization

on:
  push:
    branches:
      - mhac-integration/r006-127-serialized-20261110

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'techrote/MachineHumanAudioCybersemiotics' && github.ref == 'refs/heads/mhac-integration/r006-127-serialized-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Regenerate canonical exports
        run: python3 tools/validate.py --write-exports
      - name: Commit only expected index delta
        shell: bash
        run: |
          set -euo pipefail
          git add research/registry/generated/
          CHANGED="$(git diff --cached --name-only)"
          if [ -z "$CHANGED" ]; then
            echo 'Exports already current'
            exit 0
          fi
          if [ "$CHANGED" != 'research/registry/generated/records-index.json' ]; then
            echo "Unexpected generated delta: $CHANGED"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R006 integration: generated canonical records-index [skip ci]'
          git push origin "HEAD:refs/heads/mhac-integration/r006-127-serialized-20261110"
