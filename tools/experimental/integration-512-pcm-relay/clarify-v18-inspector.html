<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC v18 — clarification laboratory</title><style>body{font:16px system-ui,sans-serif;color:#d9e1e8;background:#141a20;max-width:1100px;margin:30px auto;padding:0 18px}h1{font-size:27px}label{display:block;margin:12px 0}button,select,input{font:inherit}article{border:1px solid #495663;padding:14px;border-radius:6px;min-width:0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:380px;overflow:auto}canvas{width:100%;height:90px;background:#0b1117}audio{width:100%}small{color:#a9bbc9}</style><h1>Clarification without commitment · v18</h1><p>Load the receipt and matching WAVs. The two policies share the same initial scenario, slot horizon and seed, but the later transmitted waveforms differ. Playback is optional; start at low device volume. A zero-valued capture gap is not observed silence.</p><label>Receipt <input type="file" id="receipt" accept=".json"></label><label>WAVs (select all or the desired pair) <input type="file" id="waves" accept=".wav" multiple></label><label>Scenario <select id="scenario"></select></label><button id="export" disabled>Export comparison trace</button><p id="status" role="status"></p><main id="panels"></main><script>
let receipt=null,files=new Map(),urls=[],pair=[];const $=id=>document.getElementById(id);const txt=(p,tag,s)=>{const n=document.createElement(tag);n.textContent=s;p.append(n);return n;};
$('receipt').onchange=async()=>{try{const r=JSON.parse(await $('receipt').files[0].text());if(r.schema!=='mhac-clarify-v18'||!Array.isArray(r.rows))throw Error('Unexpected schema');receipt=r;$('scenario').replaceChildren();for(const s of new Set(r.rows.map(x=>x.scenario))){const o=txt($('scenario'),'option',s);o.value=s;}await show();}catch(e){$('status').textContent=String(e);}};
$('waves').onchange=async()=>{files=new Map([...$('waves').files].map(f=>[f.name,f]));await show();};$('scenario').onchange=show;
async function show(){if(!receipt)return;for(const u of urls)URL.revokeObjectURL(u);urls=[];const root=$('panels');root.replaceChildren();pair=receipt.rows.filter(r=>r.scenario===$('scenario').value);$('export').disabled=!pair.length;$('status').textContent=pair.length+' policy records';for(const r of pair){const a=document.createElement('article');root.append(a);txt(a,'h2',r.policy);const m=r.metrics;txt(a,'p',`Genuine confirmations: ${m.genuine} | false: ${m.false} | requests: ${m.request} | first genuine: ${m.firstGenuine===null?'none':(m.firstGenuine/16000).toFixed(4)+' s'}`);const c=document.createElement('canvas');c.width=800;c.height=90;a.append(c);const g=c.getContext('2d');const f=files.get(r.file);const player=document.createElement('audio');player.controls=true;player.volume=.12;player.onplay=()=>{for(const other of root.querySelectorAll('audio'))if(other!==player)other.pause();};a.append(player);if(f){const u=URL.createObjectURL(f);urls.push(u);player.src=u;const b=await f.arrayBuffer(),d=new DataView(b);if(b.byteLength!==44+2*r.samples)txt(a,'small','Unexpected WAV length');else{g.strokeStyle='#88c9ef';g.beginPath();for(let x=0;x<800;x++){let lo=0,hi=0;for(let j=Math.floor(x*r.samples/800);j<Math.floor((x+1)*r.samples/800);j++){const v=d.getInt16(44+j*2,true);lo=Math.min(lo,v);hi=Math.max(hi,v);}g.moveTo(x,45-hi/32768*45);g.lineTo(x,45-lo/32768*45);}g.stroke();g.fillStyle='#dc9444';for(const [l,h] of r.gaps)g.fillRect(l/r.samples*800,0,Math.max(1,(h-l)/r.samples*800),90);}}else txt(a,'small','Select '+r.file);txt(a,'h3','Channel timeline and semantic AST');txt(a,'pre',JSON.stringify(r.trace.filter(t=>t.type!=='tx'||t.packet),null,2));txt(a,'h3','Acoustic evidence / uncertainty');txt(a,'pre',JSON.stringify(r.events,null,2));}}
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(pair,null,2)],{type:'application/json'}));a.href=u;a.download='comparison-v18.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
