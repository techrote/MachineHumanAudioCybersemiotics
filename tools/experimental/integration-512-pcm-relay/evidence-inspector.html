<!doctype html><html lang="en"><meta charset="utf-8"><title>MHAC evidence clock v5</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#111827;color:#e5e7eb}input,select,button{margin:.4rem}canvas{width:100%;height:150px;background:#1f2937}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:1rem}audio{width:100%}</style><h1>Evidence clock v5</h1><p>Choose matching exported WAV and JSON files. Audio is opt-in; start at low device volume. This inspector displays recorded evidence, not live decoding.</p><label>Session JSON <input id="trace" type="file" accept=".json"></label><label>PCM WAV <input id="wav" type="file" accept=".wav"></label><p id="status" role="status">No session loaded.</p><audio id="audio" controls preload="metadata"></audio><canvas id="wave" width="1000" height="150" aria-label="PCM envelope and release timestamps"></canvas><p>Blue: PCM peak envelope. Orange: evidence release; green: DATA transmission; purple: ACK transmission.</p><label>Trace event <select id="event"></select></label><button id="export" disabled>Export trace JSON</button><pre id="metrics"></pre><pre id="detail"></pre><script>
'use strict';const $=id=>document.getElementById(id);let trace=null,bytes=null,url=null;const a=$('audio');a.volume=.12;
function draw(){const c=$('wave'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!bytes)return;const d=new DataView(bytes);if(d.byteLength!==640044||d.getUint32(24,true)!==16000){$('status').textContent='Unexpected WAV format';return;}const n=320000;g.strokeStyle='#60a5fa';g.beginPath();for(let x=0;x<c.width;x++){let peak=0;for(let i=Math.floor(x*n/c.width);i<Math.floor((x+1)*n/c.width);i++)peak=Math.max(peak,Math.abs(d.getInt16(44+2*i,true)));const h=peak/8192*70;g.moveTo(x,75-h);g.lineTo(x,75+h);}g.stroke();if(trace)for(const e of trace.trace){if(e.type!=='evidence'&&!(e.type==='tx'&&e.packet))continue;g.strokeStyle=e.type==='evidence'?'#f59e0b':e.packet.kind?'#c084fc':'#4ade80';let x=e.at/n*c.width;g.beginPath();g.moveTo(x,0);g.lineTo(x,24);g.stroke();}}
$('trace').onchange=async()=>{try{trace=JSON.parse(await $('trace').files[0].text());if(!Array.isArray(trace.trace)||!Array.isArray(trace.evidence))throw Error('wrong trace');$('status').textContent=trace.name+' / '+trace.policy+' / guard '+trace.guard/16+' ms'; $('metrics').textContent=JSON.stringify(trace.metrics,null,2);$('event').replaceChildren(...trace.trace.map((e,i)=>new Option((e.at/16000).toFixed(4)+' s — '+e.type,i)));$('export').disabled=false;show();draw();}catch(e){trace=null;$('export').disabled=true;$('status').textContent=String(e);}};
$('wav').onchange=async()=>{const f=$('wav').files[0];if(!f)return;bytes=await f.arrayBuffer();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);a.src=url;draw();};function show(){if(!trace)return;const e=trace.trace[Number($('event').value)];$('detail').textContent=JSON.stringify(e.type==='evidence'?{...e,hypotheses:trace.evidence.filter(x=>x.at===e.at)}:e,null,2);}$('event').onchange=show;$('export').onclick=()=>{if(!trace)return;const u=URL.createObjectURL(new Blob([JSON.stringify(trace,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='evidence-trace.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
