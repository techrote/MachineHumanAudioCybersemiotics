<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC | Occurrence binding</title><style>body{font:15px system-ui;background:#101722;color:#e5eaf0;margin:24px;max-width:1200px}h1{font-size:26px}p{color:#b2c4d8}label{display:block;margin:12px 0}input,select,button{font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}article{background:#192636;padding:16px;border:1px solid #3a526a;border-radius:8px;overflow:auto}canvas{width:100%;height:100px;background:#0e1724}audio{width:100%;margin:8px 0}pre{white-space:pre-wrap;font-size:12px;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;text-align:left;border-bottom:1px solid #385067}strong{color:#8dd5ff}</style><h1>MHAC / Occurrence binding v23</h1><p>Compare reuse and persistent generation reservation on the same synthetic scenarios. False confirmations, rollback and matching forgery remain visible. No autoplay; start with low device volume.</p><label>1. Load a seed receipt <input id="receipt" type="file" accept=".json"></label><label>2. Scenario <select id="scenario"></select></label><label>3. Select WAVs from the same output directory <input id="waves" type="file" multiple accept=".wav"></label><button id="export" disabled>Export selected records</button><p id="status" role="status"></p><main id="panels"></main><script>
'use strict';const $=s=>document.querySelector(s);let data,files=new Map(),pair=[],urls=[],revision=0;function el(tag,txt,parent){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;parent.append(x);return x}async function draw(){if(!data)return;const rev=++revision;for(const u of urls)URL.revokeObjectURL(u);urls=[];const p=$('#panels');p.replaceChildren();pair=data.rows.filter(r=>r.scenario===$('#scenario').value);for(const r of pair){if(rev!==revision)return;const a=el('article',undefined,p);el('h2',r.policy,a);el('p','D confirmation '+(r.metrics.confirmed.D/16000).toFixed(3)+' s | genuine '+r.metrics.genuine+' | false '+r.metrics.falseConfirmation+' | wrong repair '+r.metrics.wrongRepair,a);el('p',r.file,a);const f=files.get(r.file);if(f){const cv=el('canvas',undefined,a);cv.width=640;cv.height=100;const audio=el('audio',undefined,a);audio.controls=true;audio.preload='metadata';audio.volume=.12;audio.src=URL.createObjectURL(f);urls.push(audio.src);const d=new DataView(await f.arrayBuffer()),n=(d.byteLength-44)/2;if(rev!==revision)return;if(n!==r.samples||d.getUint32(24,true)!==16000||d.getUint16(22,true)!==1||d.getUint16(34,true)!==16){el('p','Unexpected WAV layout',a);continue}const ctx=cv.getContext('2d');ctx.strokeStyle='#7cc6f2';ctx.beginPath();for(let x=0;x<640;x++){let peak=0;for(let i=Math.floor(x*n/640);i<Math.floor((x+1)*n/640);i++)peak=Math.max(peak,Math.abs(d.getInt16(44+2*i,true)));ctx.moveTo(x,50-peak/32768*45);ctx.lineTo(x,50+peak/32768*45)}ctx.stroke();}const t=el('table',undefined,a),h=el('tr',undefined,t);for(const c of ['Time s','Channel fixture','Decoded / generation','Decision'])el('th',c,h);for(const v of r.trace){const tr=el('tr',undefined,t);for(const c of [(v.slot*data.step/data.rate).toFixed(1),v.origin,v.e.status+' / '+(v.e.generation??'—'),v.decision])el('td',c,tr);}const det=el('details',undefined,a);el('summary','Semantic trees, uncertainty and complete acoustic evidence',det);el('pre',JSON.stringify(r.trace,null,2),det);}if(rev!==revision)return;$('#export').disabled=!pair.length;$('#status').textContent=pair.length+' policy records';}
$('#receipt').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());if(data.schema!=='mhac-generation-v23')throw Error('unexpected receipt');$('#scenario').replaceChildren();for(const s of new Set(data.rows.map(r=>r.scenario)))el('option',s,$('#scenario'));await draw()}catch(e){$('#status').textContent=e.message}};$('#scenario').onchange=draw;$('#waves').onchange=async e=>{files=new Map([...e.target.files].map(f=>[f.name,f]));await draw()};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pair,null,2)],{type:'application/json'}));a.download='generation-pair.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
