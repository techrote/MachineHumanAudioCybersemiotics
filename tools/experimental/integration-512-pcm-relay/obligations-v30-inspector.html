<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC v30 · Scoped obligations</title><style>
*{box-sizing:border-box}body{margin:24px auto;padding:0 18px;max-width:1440px;background:#10151d;color:#e4eaf3;font:15px system-ui}h1{font-size:25px;margin-bottom:4px}p,small{color:#a8b8cc}label{display:inline-block;margin:8px 15px 8px 0}select,button,input{font:inherit}select,button{background:#253449;color:#fff;border:1px solid #52637a;border-radius:5px;padding:6px}button:disabled{opacity:.5}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}article{background:#182331;border:1px solid #354659;border-radius:8px;padding:12px;min-width:0}h2{font-size:17px;margin:0 0 8px}canvas{width:100%;height:72px;background:#101923}audio{width:100%;height:34px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}td,th{text-align:left;border-bottom:1px solid #354659;padding:5px 3px}tr[data-i]{cursor:pointer}tr.selected{background:#334c65}.good{color:#95d2a8}.warn{color:#ffc88b}#error{color:#ffc88b}code{color:#c6d8ed}</style><body>
<h1>MHAC · Scoped obligations v30</h1><p>Compare exact-record closure grants and equal three-credit replay budgets. Synthetic PCM, not human or hardware evidence. Playback is optional: start with low device volume.</p>
<label>Receipt <input id="receipt" type="file" accept=".json"></label><label>Matching WAV files <input id="wavs" type="file" accept=".wav" multiple></label><br>
<label>Seed <select id="seed"></select></label><label>Scenario <select id="scenario"></select></label><label>Pair <select id="pair"></select></label><button id="export" disabled>Export selected comparison</button><p id="error" role="status"></p><main class="panels" id="panels"></main>
<script>
'use strict';let data=null,files=new Map(),urls=[];const $=id=>document.getElementById(id),el=(tag,text)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x;};function options(node,values){node.replaceChildren(...values.map(v=>{const o=el('option',String(v));o.value=v;return o;}));}function rows(){return data.rows.filter(r=>String(r.seed)===$('seed').value&&r.name===$('scenario').value);}function err(e){$('error').textContent=String(e);}
$('receipt').onchange=async()=>{try{const f=$('receipt').files[0];if(!f)return;if(f.size>8*1024*1024)throw Error('Receipt exceeds 8 MiB');data=JSON.parse(await f.text());if(data.schema!=='mhac-obligations-v30'||!Array.isArray(data.rows))throw Error('Wrong receipt schema');options($('seed'),[...new Set(data.rows.map(r=>r.seed))]);options($('scenario'),[...new Set(data.rows.map(r=>r.name))]);options($('pair'),Array.from({length:data.rows[0].trace.length},(_,i)=>i+1));$('export').disabled=false;render();}catch(e){err(e);}};
$('wavs').onchange=()=>{files=new Map([...$('wavs').files].map(f=>[f.name,f]));if(data)render();};for(const id of ['seed','scenario','pair'])$(id).onchange=()=>{if(data)render();};
$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows(),null,2)+'\n'],{type:'application/json'}));const a=el('a');a.href=u;a.download='mhac-v30-comparison.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
async function waveform(canvas,file,row){const b=await file.arrayBuffer(),d=new DataView(b);if(d.byteLength!==44+2*row.samples||d.getUint32(0,false)!==0x52494646||d.getUint32(24,true)!==16000||d.getUint16(22,true)!==1||d.getUint16(34,true)!==16)throw Error('Unexpected WAV format: '+file.name);const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,n=row.samples;ctx.clearRect(0,0,w,h);ctx.fillStyle='#29415b';ctx.fillRect((Number($('pair').value)-1)*w/row.trace.length,0,w/row.trace.length,h);ctx.strokeStyle='#a8d5ef';ctx.beginPath();for(let x=0;x<w;x++){let lo=0,hi=0;for(let i=Math.floor(x*n/w);i<Math.floor((x+1)*n/w);i++){const v=d.getInt16(44+2*i,true);lo=Math.min(lo,v);hi=Math.max(hi,v);}ctx.moveTo(x,h/2-hi/4096*h*.45);ctx.lineTo(x,h/2-lo/4096*h*.45);}ctx.stroke();}
function render(){for(const u of urls)URL.revokeObjectURL(u);urls=[];$('panels').replaceChildren();$('error').textContent='';const chosen=Number($('pair').value)-1;for(const row of rows()){const pane=el('article'),m=row.metrics;pane.append(el('h2',row.policy),el('p',`Old obligations settled ${m.settled}/3 · B ${m.bSettled?'settled':'uncertain'} · ${m.applies} applications`));const canvas=el('canvas');canvas.width=640;canvas.height=90;canvas.setAttribute('aria-label','Received PCM waveform');pane.append(canvas);const f=files.get(row.file);if(f){const u=URL.createObjectURL(f);urls.push(u);const audio=el('audio');audio.controls=true;audio.preload='metadata';audio.volume=.12;audio.src=u;pane.append(audio);waveform(canvas,f,row).catch(err);}else pane.append(el('small','Select '+row.file));const table=el('table'),head=el('tr');for(const t of ['Pair','Offer','Receiver decision','B sender','Pool'])head.append(el('th',t));table.append(head);row.trace.forEach((t,i)=>{const tr=el('tr');tr.dataset.i=i;if(i===chosen)tr.className='selected';for(const v of [i+1,t.label+' / '+t.action,t.decision.decision,t.states.B.state,t.receiver.pool])tr.append(el('td',String(v)));tr.onclick=()=>{$('pair').value=i+1;render();};table.append(tr);});pane.append(table,el('h2','Selected pair: decoded evidence and state'),el('pre',JSON.stringify(row.trace[chosen],null,2)));$('panels').append(pane);}}
</script></body></html>
