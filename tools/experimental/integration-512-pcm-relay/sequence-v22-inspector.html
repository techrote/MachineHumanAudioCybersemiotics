<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC — Sequence-qualified requests</title><style>body{background:#101722;color:#e5eaf0;font:15px system-ui;margin:24px;max-width:1100px}h1{font-size:26px}p{color:#b2c4d8}label{display:block;margin:12px 0}input,select,button{font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}article{background:#192636;padding:16px;border:1px solid #3a526a;border-radius:8px;overflow:auto}canvas{width:100%;height:100px;background:#0e1724}audio{width:100%;margin-top:8px}pre{white-space:pre-wrap;font-size:12px;max-height:370px;overflow:auto}strong{color:#8dd5ff}</style><h1>MHAC / Sequence-qualified requests</h1><p>Offline synthetic communication laboratory. Compare tag-only and sequence-qualified references. Reuse and forgery are retained negative controls. No autoplay; start at low volume.</p><label>1. Load receipt <input id="receipt" type="file" accept=".json"></label><label>2. Scenario <select id="scenario"></select></label><label>3. Select matching WAV files <input id="waves" type="file" multiple accept=".wav"></label><button id="export" disabled>Export pair JSON</button><p id="status" role="status"></p><main id="panels"></main><script>'use strict';const $=s=>document.querySelector(s);let data=null,files=new Map(),pair=[],urls=[];function el(tag,txt,parent){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;parent.append(x);return x}async function draw(){if(!data)return;for(const u of urls)URL.revokeObjectURL(u);urls=[];const p=$('#panels');p.replaceChildren();pair=data.rows.filter(r=>r.scenario===$('#scenario').value);for(const r of pair){const a=el('article',undefined,p);el('h2',r.policy,a);el('p',`D confirmation ${(r.metrics.confirmed.D/16000).toFixed(3)} s | wrong repair ${r.metrics.wrongRepair} | forged honored ${r.metrics.forgedHonored} | admission ${(r.metrics.admitted/16000).toFixed(3)} s`,a);const file=files.get(r.file);el('p',r.file,a);if(file){const cv=el('canvas',undefined,a);cv.width=640;cv.height=100;const audio=el('audio',undefined,a);audio.controls=true;audio.preload='metadata';audio.volume=.12;audio.src=URL.createObjectURL(file);urls.push(audio.src);const d=new DataView(await file.arrayBuffer()),n=(d.byteLength-44)/2,ctx=cv.getContext('2d');ctx.strokeStyle='#7cc6f2';ctx.beginPath();for(let x=0;x<640;x++){let peak=0;for(let i=Math.floor(x*n/640);i<Math.floor((x+1)*n/640);i++)peak=Math.max(peak,Math.abs(d.getInt16(44+2*i,true)));ctx.moveTo(x,50-peak/32768*45);ctx.lineTo(x,50+peak/32768*45)}ctx.stroke();}el('h3','Context / control / evidence trace',a);el('pre',JSON.stringify(r.trace.filter(t=>t.type!=='tx'),null,2),a);const det=el('details',undefined,a);el('summary','Full semantic and acoustic evidence',det);el('pre',JSON.stringify({gaps:r.gaps,events:r.events,controls:r.controls},null,2),det)}$('#export').disabled=!pair.length;$('#status').textContent=`${pair.length} policy records`;}
$('#receipt').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());if(data.schema!=='mhac-sequence-v22')throw Error('unexpected receipt');$('#scenario').replaceChildren();for(const s of new Set(data.rows.map(r=>r.scenario)))el('option',s,$('#scenario'));await draw()}catch(e){$('#status').textContent=e.message}};$('#scenario').onchange=draw;$('#waves').onchange=async e=>{files=new Map([...e.target.files].map(f=>[f.name,f]));await draw()};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pair,null,2)],{type:'application/json'}));a.download='sequence-pair.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script>
