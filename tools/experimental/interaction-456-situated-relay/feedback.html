<!doctype html><html lang="en"><meta charset="utf-8"><title>Situated feedback</title><style>body{font:16px system-ui;background:#192127;color:#e8edf1;max-width:1000px;margin:24px auto;padding:0 16px}button,select,input{font:inherit;margin:5px;padding:7px}pre{white-space:pre-wrap;max-height:350px;overflow:auto;background:#10171b;padding:12px}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid #49545d;text-align:right}td:first-child,th:first-child{text-align:left}.slot{display:inline-block;width:14px;height:24px;margin:1px;background:#444}.pump{background:#46a99c}.fan{background:#b497db}.relay{background:#d8a059}</style><h1>Situated feedback laboratory</h1><p>Fictional sources; emission, modeled receipt and confirmation differ. Audio is optional motif replay, not a decoder.</p><label>Scenario <select id="scenario"></select></label><label>Policy <select id="policy"></select></label><label>Loss % <input id="loss" type="number" min="0" max="100" value="30"></label><label>Feedback delay (ticks) <input id="delay" type="number" min="1" max="20" value="2"></label><button id="reset">Reset</button><button id="step">Advance 250 ms</button><button id="run">Run to end</button><div><button id="pump">Offer pump</button><button id="fan">Offer fan</button><button id="relay">Offer relay</button><button id="drop">Erase if next tick completes a packet</button></div><p id="status" aria-live="polite"></p><div id="timeline"></div><table><thead><tr><th>Source</th><th>Offered</th><th>Received</th><th>Claimed</th><th>False</th><th>Unconfirmed</th><th>Retries</th></tr></thead><tbody id="metrics"></tbody></table><button id="play">Play optional replay</button><button id="stop">Stop</button><button id="wav">Export WAV</button><button id="json">Export trace</button><button id="test">Run tests</button><p>Start at low device volume; digital gain is not calibrated SPL.</p><pre id="trace"></pre><script src="attention.js"></script><script src="feedback.js"></script><script>
const F=FeedbackLab,$=id=>document.getElementById(id);let until=0,manual=[],r,audio,url;
for(const [id,list] of [["scenario",F.names],["policy",F.policies]])for(const x of list)$(id).add(new Option(x,x));$("policy").value="repair";
function config(){return {...F.config($("scenario").value),loss:Math.max(0,Math.min(100,Math.round(Number($("loss").value)||0))),delay:Math.max(1,Math.min(20,Math.round(Number($("delay").value)||1)))}}
function render(){r=F.simulate(config(),$("policy").value,until,manual);$("status").textContent="Tick "+until+" / "+r.config.horizon+"; pending feedback "+r.pendingFeedback.length+"; occupied "+r.used;
$("timeline").replaceChildren(...r.segments.map(s=>{const e=document.createElement("span");e.className="slot "+(s.agent||"");e.title=s.t+": "+(s.id||"silence");return e}));
$("metrics").replaceChildren(...F.agents.map(a=>{const tr=document.createElement("tr");for(const x of [a,...Object.values(r.metrics[a])]){const td=document.createElement("td");td.textContent=x;tr.append(td)}return tr}));$("trace").textContent=r.trace.map(e=>JSON.stringify(e)).join("\n")}
function stop(){if(audio){audio.pause();audio=null}if(url){URL.revokeObjectURL(url);url=null}}
function reset(){stop();until=0;manual=[];render()}
$("reset").onclick=reset;$("scenario").onchange=reset;$("policy").onchange=render;$("loss").onchange=render;$("delay").onchange=render;$("step").onclick=()=>{until=Math.min(config().horizon,until+1);render()};$("run").onclick=()=>{until=config().horizon;render()};
for(const a of F.agents)$(a).onclick=()=>{if(until<config().horizon&&manual.length<400){manual.push({op:"offer",t:until,agent:a});$("step").click()}};
$("drop").onclick=()=>{if(until<config().horizon&&manual.length<400){manual.push({op:"drop",t:until});$("step").click()}};
$("play").onclick=()=>{stop();url=URL.createObjectURL(new Blob([F.render(r.segments).bytes],{type:"audio/wav"}));audio=new Audio(url);audio.volume=.15;audio.play().catch(e=>$("status").textContent=e.message)};$("stop").onclick=stop;
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$("wav").onclick=()=>save(new Blob([F.render(r.segments).bytes],{type:"audio/wav"}),"feedback.wav");$("json").onclick=()=>save(new Blob([JSON.stringify(r,null,2)],{type:"application/json"}),"feedback.json");$("test").onclick=()=>{const q=F.qualify();$("trace").textContent=JSON.stringify({assertions:q.assertions,runs:q.runs,aggregate:q.aggregate},null,2)};render();
</script></html>
